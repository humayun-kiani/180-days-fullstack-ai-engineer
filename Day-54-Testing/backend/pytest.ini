[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (DB, HTTP)
    slow: Slow tests (external APIs)