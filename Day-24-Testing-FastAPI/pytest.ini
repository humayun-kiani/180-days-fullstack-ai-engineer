[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --strict-markers
    --no-header
markers =
    slow: marks slow tests (deselect with -m 'not slow')
    integration: marks integration tests
    unit: marks unit tests
    auth: marks auth tests
    ws: marks WebSocket tests