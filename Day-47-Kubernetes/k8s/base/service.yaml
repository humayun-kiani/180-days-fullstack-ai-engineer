# k8s/base/service.yaml
# Stable network endpoint for the task-api pods

apiVersion: v1
kind: Service
metadata:
  name: task-api-service
  namespace: task-api
  labels:
    app: task-api
  annotations:
    description: "ClusterIP service for task-api pods"

spec:
  # Route traffic to pods with this label
  selector:
    app: task-api

  ports:
    - name: http
      protocol: TCP
      port: 80 # What clients connect to
      targetPort: 8000 # Where pods listen

  # ClusterIP: only accessible within the cluster
  # NodePort: also accessible via node's IP on a high port
  # LoadBalancer: cloud load balancer (AWS ELB, GCP LB)
  type: ClusterIP

  # For session affinity (same client → same pod):
  # sessionAffinity: ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800
