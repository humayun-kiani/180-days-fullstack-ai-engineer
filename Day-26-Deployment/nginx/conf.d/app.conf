# ============================================================
# nginx/conf.d/app.conf
# HTTP configuration — redirects to HTTPS once SSL is set up
# Initially serves both HTTP and ACME challenge
# ============================================================

# Upstream — FastAPI application
upstream taskmanager_app {
    server app:8000;           # 'app' is the service name in docker-compose
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com yourdomain.com;

    # ── Let's Encrypt ACME challenge ─────────────────────
    # Must be accessible over HTTP for SSL certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Redirect all HTTP to HTTPS ───────────────────────
    # Comment this out BEFORE getting SSL certificate,
    # uncomment AFTER certificate is obtained
    location / {
        return 301 https://$host$request_uri;
    }
}